services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dcim
      MYSQL_USER: dcim
      MYSQL_PASSWORD: dcim
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - dcim_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dcim_mysql_data:
