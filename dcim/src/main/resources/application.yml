spring:
  application:
    name: dcim
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dcim?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:dcim}
    password: ${DB_PASSWORD:dcim}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

dcim:
  jwt:
    # U produkciji obavezno postaviti JWT_SECRET na nasumičnu Base64 vrednost od najmanje 32 bajta.
    secret: ${JWT_SECRET:ZGNpbS1kZXZlbG9wbWVudC1zZWNyZXQta2V5LTEyMzQ1Njc4OTA=}
    expiration: ${JWT_EXPIRATION:PT8H}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
    email: ${ADMIN_EMAIL:admin@dcim.local}
